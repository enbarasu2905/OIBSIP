<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    
<!-- Intro Screen -->
<div id="intro">

    <div class="intro-card">

        <h1>Task 3</h1>

        <h2>Temperature Converter</h2>

        <hr>

        <p><strong>Name :</strong> Enbarasu E</p>

        <p><strong>Level :</strong> Level 1</p>

        <button onclick="enterWebsite()">
            Enter Website
        </button>

    </div>

</div>
    <div id="website" style="display:none;">
    <div class="container">

        <h1>🌡 Temperature Converter</h1>

        <label>Enter Temperature</label>
        <input
            type="number"
            id="temperature"
            placeholder="Enter value">

        <label>Select Input Unit</label>

        <select id="unit">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>

        <button onclick="convertTemperature()">
            Convert
        </button>

        <p id="error"></p>

        <div class="result">

            <h3>Converted Values</h3>

            <p id="celsius">Celsius : --</p>

            <p id="fahrenheit">Fahrenheit : --</p>

            <p id="kelvin">Kelvin : --</p>

        </div>
    </div>
    </div>

<script src="script.js"></script>

</body>
</html>
